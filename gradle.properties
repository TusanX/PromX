org.gradle.jvmargs=-Xmx3g -Dfile.encoding=UTF-8
android.useAndroidX=true
kotlin.code.style=official
android.nonTransitiveRClass=true
# Keep the installed app after connected tests for continued phone acceptance.
android.injected.androidTest.leaveApksInstalledAfterRun=true
# Prefer official repositories; keep mirrors as a fallback.
lei.officialRepositoriesFirst=true
android.overridePathCheck=true
android.r8.optimizedResourceShrinking=true

# 本机构建：Java 走 macOS 钥匙串导出的信任库（Gradle 发行包已用 curl 预下载）
org.gradle.jvmargs=-Djavax.net.ssl.trustStore=/tmp/trust.jks -Djavax.net.ssl.trustStorePassword=changeit -Xmx4g
systemProp.javax.net.ssl.trustStore=/tmp/trust.jks
systemProp.javax.net.ssl.trustStorePassword=changeit
