  <script>
    (() => {
      const syncViewport = () => {
        const height = Math.max(
          window.innerHeight || 0,
          window.visualViewport?.height || 0,
          document.documentElement.clientHeight || 0,
          1
        );
        document.documentElement.style.setProperty("--promx-viewport-height", `${Math.round(height)}px`);
      };
      syncViewport();
      window.addEventListener("resize", syncViewport, { passive: true });
      window.visualViewport?.addEventListener("resize", syncViewport, { passive: true });
      window.addEventListener("load", syncViewport, { passive: true });
      requestAnimationFrame(() => requestAnimationFrame(syncViewport));
    })();
    (() => {
      const quality = new URLSearchParams(location.search).get("q") || "balanced";
      const fps = quality === "full" ? 60 : quality === "saver" ? 30 : 45;
      document.documentElement.dataset.promxQuality = quality;
      if (quality !== "full") document.documentElement.dataset.reduceMotion = "uiMicroMotion";
      // Android WebView 113 can stop issuing callbacks through the standard RAF entry
      // after the first WebGL frame. The WebKit alias remains the real native scheduler.
      const nativeRaf = window.webkitRequestAnimationFrame?.bind(window);
      const nativeCancel = window.webkitCancelAnimationFrame?.bind(window);
      if (nativeRaf) window.requestAnimationFrame = nativeRaf;
      if (nativeCancel) window.cancelAnimationFrame = nativeCancel;
      window.PromXStageQuality = { name: quality, fps };
    })();
  </script>
